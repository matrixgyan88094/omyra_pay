name: Build OMYRA Pay APK & Publish Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Production Release APK
        run: |
          gradle assembleRelease

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/omyra_pay.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omyra-pay-release-apk
          path: release-artifacts/omyra_pay.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('OMYRA Pay {0}', github.ref_name) || 'OMYRA Pay v1.0.0 Production' }}
          files: release-artifacts/omyra_pay.apk
          body: |
            ## OMYRA Pay Official Production Release
            - **App:** OMYRA Pay (`com.omyra.pay`)
            - **Security:** Quantum-grade hardware-backed AES-256-GCM encryption with anti-tamper
            - **Authentication:** Hardware biometric authorization bridge
            - **Protection:** `FLAG_SECURE` screen recording & screenshot defense
            - **In-App Updater:** Integrated OTA GitHub auto-updater
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
