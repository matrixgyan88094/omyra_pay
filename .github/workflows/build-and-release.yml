name: Build OMYRA Pay APK & Publish Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Production Release APK
        run: |
          gradle assembleRelease

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/omyra_pay.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omyra-pay-release-apk
          path: release-artifacts/omyra_pay.apk

      - name: Create GitHub Release (on version tag or manual trigger)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: release-artifacts/omyra_pay.apk
          name: OMYRA Pay ${{ github.ref_name }}
          body: |
            ## OMYRA Pay Android Release
            - Quantum Cryptographic Security (Hardware-isolated AES-256-GCM)
            - Official Biometric Authorization Bridge
            - Anti-Screen Recording & Capture Defense (`FLAG_SECURE`)
            - Integrated OTA In-App Auto-Updater
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
